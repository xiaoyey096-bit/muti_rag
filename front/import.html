<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>格物智答 · 知识库导入</title>
<script src="/front/config.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f8fafc;
    --surface-3:#f1f5f9;
    --text:#0f172a;
    --muted:#64748b;
    --faint:#94a3b8;
    --border:#e2e8f0;
    --brand:#4f46e5;
    --brand-2:#2563eb;
    --accent:#0ea5e9;
    --success:#059669;
    --warning:#d97706;
    --danger:#dc2626;
    --info:#2563eb;
    --ring:rgba(79,70,229,.16);
    --shadow:0 12px 32px -16px rgba(15,23,42,.18);
    --shadow-sm:0 2px 10px -4px rgba(15,23,42,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,Arial,sans-serif;
    color:var(--text);
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 12% 0%, rgba(79,70,229,.05) 0%, transparent 42%),
      radial-gradient(circle at 88% 8%, rgba(14,165,233,.05) 0%, transparent 42%),
      linear-gradient(to right, rgba(15,23,42,.022) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(15,23,42,.022) 1px, transparent 1px);
    background-size:100% 100%,100% 100%,44px 44px,44px 44px;
    min-height:100vh;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--surface-2)}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid var(--surface-2)}
  ::-webkit-scrollbar-thumb:hover{background:var(--brand)}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:960px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:12px;
  }
  .logo{
    width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--brand),var(--accent));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px -6px rgba(79,70,229,.5);
  }
  .logo svg{width:20px;height:20px;stroke:#fff}
  .brand-title{display:flex;flex-direction:column;line-height:1.15}
  .brand-title strong{font-size:16px;letter-spacing:.3px}
  .brand-title span{font-size:12px;color:var(--muted);margin-top:2px}
  .top-link{
    margin-left:auto;font-size:13px;color:var(--brand-2);text-decoration:none;
    border:1px solid var(--border);background:var(--surface);
    padding:7px 12px;border-radius:999px;transition:.15s;
  }
  .top-link:hover{border-color:var(--brand);box-shadow:var(--shadow-sm)}

  .wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:18px}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    box-shadow:var(--shadow-sm);padding:20px;
    animation:rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.1s}
  .card:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .card-head h2{font-size:15px;margin:0;font-weight:700}
  .card-head .tag{
    font-size:11px;color:var(--brand);background:rgba(79,70,229,.08);
    border:1px solid rgba(79,70,229,.2);padding:2px 9px;border-radius:999px;font-weight:600;
  }
  .card-head .sub{font-size:12px;color:var(--muted);margin-left:auto}

  /* 问答入口（筛选框） */
  .entry-card{
    background:linear-gradient(120deg,rgba(79,70,229,.06),rgba(14,165,233,.06));
    border:1px solid rgba(79,70,229,.22);
  }
  .entry-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .entry-row select{flex:1;min-width:240px}
  .entry-tip{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.6}

  select,input[type=text]{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:10px;font-size:13px;outline:none;transition:.15s;
    font-family:inherit;
  }
  select:focus,input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
  select{cursor:pointer}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:10px;color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    box-shadow:0 6px 16px -8px rgba(79,70,229,.6);transition:.15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px -8px rgba(79,70,229,.65)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{
    background:var(--surface);color:var(--brand-2);border:1px solid var(--border);box-shadow:none;
  }
  .btn-ghost:hover{border-color:var(--brand);box-shadow:var(--shadow-sm)}

  .import-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .import-row label{font-size:13px;color:var(--muted);flex:0 0 auto}
  .import-row select{min-width:220px}
  .import-row input{flex:1;min-width:180px}

  .upload-area{
    border:2px dashed rgba(79,70,229,.35);background:var(--surface-2);
    border-radius:14px;padding:36px 20px;text-align:center;cursor:pointer;transition:.2s;
  }
  .upload-area:hover,.upload-area.drag{
    border-color:var(--brand);background:rgba(79,70,229,.05);
    box-shadow:inset 0 0 0 4px rgba(79,70,229,.05);
  }
  .upload-icon{font-size:42px;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(79,70,229,.25))}
  .upload-text{color:var(--muted);font-size:14px}
  .upload-text b{color:var(--text)}
  .upload-sub{color:var(--faint);font-size:12px;margin-top:6px}
  .file-input{display:none}

  /* 管理列表 */
  .kb-search{width:100%;margin-bottom:12px}
  .kb-list{display:flex;flex-direction:column;gap:8px}
  .kb-line{
    display:flex;align-items:center;gap:10px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:13px;transition:.15s;
  }
  .kb-line:hover{border-color:rgba(79,70,229,.35);box-shadow:var(--shadow-sm)}
  .kb-line-name{font-weight:700}
  .kb-line-meta{color:var(--muted);font-size:12px}
  .kb-line .spacer{flex:1}
  .kb-del{
    background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.35);color:var(--danger);
    padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .kb-del:hover{background:rgba(220,38,38,.14)}
  .kb-empty{color:var(--muted);font-size:13px;padding:8px 2px}

  /* 上传任务 */
  .file-list{display:flex;flex-direction:column;gap:14px}
  .file-item{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    box-shadow:var(--shadow-sm);transition:.2s;animation:rise .35s both;
  }
  .file-item:hover{border-color:rgba(79,70,229,.3)}
  .file-info{display:flex;flex-direction:column;flex:1;min-width:0}
  .file-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
  .file-name{font-weight:700;font-size:14px;overflow-wrap:anywhere}
  .file-size{font-size:12px;color:var(--faint);flex:0 0 auto}
  .status-badge{
    padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;
    min-width:76px;text-align:center;letter-spacing:.4px;flex:0 0 auto;
  }
  .status-uploading{background:linear-gradient(135deg,#f59e0b,#d97706)}
  .status-queued{background:linear-gradient(135deg,#a855f7,#7c3aed)}
  .status-waiting{background:linear-gradient(135deg,#f97316,#ea580c)}
  .status-processing{background:linear-gradient(135deg,#3b82f6,#2563eb)}
  .status-completed{background:linear-gradient(135deg,#10b981,#059669)}
  .status-error{background:linear-gradient(135deg,#ef4444,#dc2626)}
  .progress-wrapper{margin-top:4px;display:none}
  .progress-bar-container{width:100%;height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden}
  .progress-bar{height:100%;width:0%;border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1),background-color .4s;position:relative;overflow:hidden}
  .progress-bar::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 100%);
    animation:shimmer 2s infinite;
  }
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .progress-text{font-size:12px;color:var(--muted);margin-top:6px;text-align:right;font-variant-numeric:tabular-nums}
  .log-details{
    margin-top:12px;font-size:13px;color:var(--text);background:var(--surface-2);
    border-radius:12px;padding:12px 14px;border:1px solid var(--border);
  }
  .log-details summary{
    cursor:pointer;user-select:none;color:var(--text);outline:none;display:flex;align-items:center;
    font-weight:700;font-size:12.5px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  .log-details summary:hover{color:var(--brand)}
  .log-details[open] summary{margin-bottom:4px}
  .log-list{margin:8px 0 0 0;padding:0 0 0 20px;list-style:none;max-height:200px;overflow-y:auto;position:relative}
  .log-list::before{
    content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;border-radius:1px;
    background:linear-gradient(180deg,rgba(79,70,229,.35),rgba(5,150,105,.35));
  }
  .log-list::-webkit-scrollbar{width:6px}
  .log-list::-webkit-scrollbar-thumb{background:#cbd5e1;border:none}
  .log-list li{margin:0;padding:8px 10px;line-height:1.5;display:flex;align-items:center;position:relative;border-radius:8px}
  .log-list li:hover{background:rgba(79,70,229,.04)}
  .log-list li::before{
    content:"";position:absolute;left:-17px;width:10px;height:10px;border-radius:50%;
    border:2px solid #cbd5e1;background:#fff;box-shadow:0 0 0 3px var(--surface-2);z-index:1;
  }
  .log-done{color:#065f46}
  .log-done::before{background:var(--success)!important;border-color:var(--success)!important;box-shadow:0 0 6px rgba(5,150,105,.4),0 0 0 3px var(--surface-2)!important}
  .log-duration{
    margin-left:auto;font-size:11.5px;color:var(--brand-2);background:rgba(37,99,235,.08);
    border:1px solid rgba(37,99,235,.22);padding:2px 10px;border-radius:999px;white-space:nowrap;
    font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;
  }
  .log-running{color:var(--brand-2);animation:pulseText 2s infinite}
  .log-running::before{background:var(--info)!important;border-color:var(--info)!important;box-shadow:0 0 6px rgba(37,99,235,.5),0 0 0 3px var(--surface-2)!important;animation:pulseNode 2s infinite!important}
  @keyframes pulseText{0%,100%{opacity:1}50%{opacity:.65}}
  @keyframes pulseNode{0%,100%{box-shadow:0 0 6px rgba(37,99,235,.5),0 0 0 3px var(--surface-2)}50%{box-shadow:0 0 12px rgba(37,99,235,.8),0 0 0 3px var(--surface-2)}}

  @media (max-width:640px){
    .entry-row select{min-width:100%}
    .file-item{flex-direction:column}
    .status-badge{align-self:flex-start}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <div class="brand-title">
      <strong>格物智答 · 知识库导入</strong>
      <span>上传产品资料，构建专属问答知识库</span>
    </div>
    <a class="top-link" id="linkChat" href="#">前往问答 →</a>
  </div>
</header>

<main class="wrap">

  <!-- 问答入口：下拉筛选框 -->
  <section class="card entry-card">
    <div class="card-head">
      <h2>问答入口</h2>
      <span class="tag">筛选进入</span>
      <span class="sub">选择产品，立即开始问答</span>
    </div>
    <div class="entry-row">
      <select id="entrySelect" aria-label="筛选产品智能体"></select>
      <button class="btn" id="btnEnter" disabled>进入问答</button>
    </div>
    <p class="entry-tip">选择你要咨询的产品，进入它的专属问答页面；也可以在本页上传资料，创建新的产品知识库。</p>
  </section>

  <!-- 导入 -->
  <section class="card">
    <div class="card-head">
      <h2>导入文档</h2>
      <span class="tag">PDF / MD</span>
    </div>
    <div class="import-row">
      <label>导入到：</label>
      <select id="kbSelect"></select>
      <input type="text" id="newProductName" placeholder="新产品名，如 DGX Spark" style="display:none;">
      <button class="btn btn-ghost" id="btnRefreshKbs">刷新</button>
    </div>
    <div class="upload-area" id="dropZone">
      <div class="upload-icon">☁️</div>
      <div class="upload-text">点击或拖拽文件到此处 <b>(PDF / MD)</b></div>
      <div class="upload-sub">支持 PDF 与 Markdown，文档中的图片和表格会自动识别入库</div>
      <input type="file" id="fileInput" class="file-input" accept=".pdf,.md" multiple>
    </div>
  </section>

  <!-- 管理 -->
  <section class="card">
    <div class="card-head">
      <h2>知识库管理</h2>
      <span class="sub" id="kbCount"></span>
    </div>
    <input type="text" class="kb-search" id="kbSearch" placeholder="搜索产品名称…">
    <div class="kb-list" id="kbList"></div>
  </section>

  <!-- 任务 -->
  <section class="card">
    <div class="card-head"><h2>导入任务</h2><span class="sub">实时展示处理进度</span></div>
    <div id="fileList" class="file-list"></div>
  </section>

</main>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');

  const API_BASE = (window.GW && GW.IMPORT) || `${location.protocol}//${location.host}`;
  const QUERY_BASE = (window.GW && GW.QUERY) || `http://${location.hostname}:8003`;

  const kbSelect = document.getElementById('kbSelect');
  const entrySelect = document.getElementById('entrySelect');
  const btnEnter = document.getElementById('btnEnter');
  const newProductName = document.getElementById('newProductName');
  const kbList = document.getElementById('kbList');
  const kbSearch = document.getElementById('kbSearch');
  const kbCount = document.getElementById('kbCount');
  const btnRefreshKbs = document.getElementById('btnRefreshKbs');
  const linkChatEl = document.getElementById('linkChat');
  linkChatEl.href = `${QUERY_BASE}/front/chat.html`;
  // 在统一入口里点它只切 Tab，不再另开窗口
  if (window.GW) linkChatEl.addEventListener('click', (e) => { e.preventDefault(); GW.navigate('chat'); });
  // 嵌在统一入口里时顶部已有 Tab，重复的跳转链接不显示
  if (window.self !== window.top) linkChatEl.style.display = 'none';
  let kbsCache = [];

  function escapeHtml(s){
    return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  }
  function kbName(k){ return k.display_name || k.product_name || '未命名'; }

  async function loadKbs(){
    try{
      const res = await fetch(`${API_BASE}/kbs`);
      kbsCache = res.ok ? await res.json() : [];
    }catch(e){ kbsCache = []; }

    const prevImport = kbSelect.value;
    kbSelect.innerHTML = '<option value="__new__">＋ 新建产品…</option>' +
      kbsCache.map(k => `<option value="${k.kb_id}">${escapeHtml(kbName(k))}</option>`).join('');
    if(prevImport && [...kbSelect.options].some(o => o.value === prevImport)) kbSelect.value = prevImport;

    const prevEntry = entrySelect.value;
    entrySelect.innerHTML = '<option value="">选择产品智能体…</option>' +
      kbsCache.map(k => `<option value="${k.kb_id}">${escapeHtml(kbName(k))}</option>`).join('');
    if(prevEntry && [...entrySelect.options].some(o => o.value === prevEntry)) entrySelect.value = prevEntry;
    syncEnterBtn();

    toggleNewInput();
    renderKbList();
  }

  function syncEnterBtn(){ btnEnter.disabled = !entrySelect.value; }
  function toggleNewInput(){ newProductName.style.display = kbSelect.value === '__new__' ? '' : 'none'; }

  function renderKbList(){
    const q = (kbSearch.value || '').trim().toLowerCase();
    const rows = kbsCache.filter(k => !q || kbName(k).toLowerCase().includes(q));
    kbCount.textContent = `共 ${kbsCache.length} 个知识库`;
    kbList.innerHTML = '';
    if(!kbsCache.length){
      kbList.innerHTML = '<div class="kb-empty">暂无知识库。上传文档时选择“新建产品”即可创建。</div>';
      return;
    }
    if(!rows.length){
      kbList.innerHTML = '<div class="kb-empty">没有匹配的产品。</div>';
      return;
    }
    for(const k of rows){
      const line = document.createElement('div');
      line.className = 'kb-line';
      line.innerHTML =
        `<span class="kb-line-name">${escapeHtml(kbName(k))}</span>` +
        `<span class="kb-line-meta">${(k.doc_titles || []).length} 篇文档 · ${(k.item_names || []).length} 个产品名</span>` +
        `<span class="spacer"></span>` +
        `<button class="kb-del">删除</button>`;
      line.querySelector('.kb-del').addEventListener('click', () => deleteKb(k.kb_id, kbName(k)));
      kbList.appendChild(line);
    }
  }

  async function deleteKb(id, name){
    if(!confirm(`确定删除知识库「${name}」？将同时清除其向量数据，无法恢复。`)) return;
    try{
      const res = await fetch(`${API_BASE}/kbs/${id}`, { method: 'DELETE' });
      if(!res.ok) throw new Error(await res.text());
      await loadKbs();
    }catch(e){ alert('删除失败：' + (e.message || e)); }
  }

  kbSelect.addEventListener('change', toggleNewInput);
  entrySelect.addEventListener('change', syncEnterBtn);
  btnEnter.addEventListener('click', () => {
    if(!entrySelect.value) return;
    // 统一入口里切到问答 Tab 并带上知识库；单独打开本页时仍退回新标签页
    if (window.GW) { GW.navigate('chat', entrySelect.value); return; }
    window.open(`${QUERY_BASE}/front/chat.html?kb_id=${entrySelect.value}`, '_blank', 'noopener');
  });
  kbSearch.addEventListener('input', renderKbList);
  btnRefreshKbs.addEventListener('click', loadKbs);

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('drag'); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); dropZone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value=''; });

  function handleFiles(files){ Array.from(files).forEach(f => uploadFile(f)); }

  // ==================== 分片上传基础设施 ====================

  const PART_CONCURRENCY = 3;
  const PART_RETRY_DELAYS = [1000, 2000, 4000];   // 单片最多 3 次重试（1/2/4s + 抖动）
  const LS_KEY = 'gwzd_import_pending_v1';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const totalNodesFor = name => name.toLowerCase().endsWith('.pdf') ? 9 : 8;

  function loadPending(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY) || '[]') || []; }catch(e){ return []; }
  }
  function savePending(entry){
    const list = loadPending().filter(x => x.key !== entry.key);
    entry.updatedAt = Date.now();
    list.push(entry);
    localStorage.setItem(LS_KEY, JSON.stringify(list));
  }
  function clearPending(pred){
    localStorage.setItem(LS_KEY, JSON.stringify(loadPending().filter(x => !pred(x))));
  }

  async function apiJson(url, options){
    const res = await fetch(API_BASE + url, options);
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.detail || `请求失败（${res.status}）`);
    return data;
  }

  async function runPool(items, limit, worker){
    let cursor = 0;
    const runners = Array.from({length: Math.min(limit, items.length)}, async () => {
      while(cursor < items.length){
        const item = items[cursor++];
        await worker(item);
      }
    });
    await Promise.all(runners);
  }

  // 增量 SHA-256（WebCrypto 不支持流式，这里内置实现，避免整文件读入内存）
  function createSha256(){
    const K = new Uint32Array([
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ]);
    const h = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
    let buffer = new Uint8Array(0);
    let totalBytes = 0;
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    function block(bytes){
      const w = new Uint32Array(64);
      for(let i = 0; i < 16; i++){
        w[i] = (bytes[i*4] << 24) | (bytes[i*4+1] << 16) | (bytes[i*4+2] << 8) | bytes[i*4+3];
      }
      for(let i = 16; i < 64; i++){
        const s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
        const s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
      for(let i = 0; i < 64; i++){
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0;
      h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+hh)>>>0;
    }
    return {
      update(data){
        totalBytes += data.length;
        const merged = new Uint8Array(buffer.length + data.length);
        merged.set(buffer); merged.set(data, buffer.length);
        let off = 0;
        while(merged.length - off >= 64){ block(merged.subarray(off, off + 64)); off += 64; }
        buffer = merged.slice(off);
      },
      hex(){
        const bitLen = totalBytes * 8;
        const padLen = buffer.length < 56 ? 56 - buffer.length : 120 - buffer.length;
        const fin = new Uint8Array(buffer.length + padLen + 8);
        fin.set(buffer); fin[buffer.length] = 0x80;
        const dv = new DataView(fin.buffer);
        dv.setUint32(fin.length - 8, Math.floor(bitLen / 4294967296));
        dv.setUint32(fin.length - 4, bitLen >>> 0);
        for(let off = 0; off < fin.length; off += 64) block(fin.subarray(off, off + 64));
        return Array.from(h).map(x => x.toString(16).padStart(8, '0')).join('');
      }
    };
  }

  async function hashFile(file, onProgress){
    const sha = createSha256();
    const SLICE = 8 * 1024 * 1024;
    for(let off = 0; off < file.size; off += SLICE){
      const buf = new Uint8Array(await file.slice(off, Math.min(off + SLICE, file.size)).arrayBuffer());
      sha.update(buf);
      if(onProgress) onProgress(Math.min(off + SLICE, file.size) / Math.max(file.size, 1));
    }
    return sha.hex();
  }

  function createUploadCard(name, sizeBytes){
    const id = 'file-' + Math.random().toString(36).slice(2, 10);
    const sizeText = sizeBytes >= 1048576
      ? (sizeBytes / 1048576).toFixed(2) + ' MB'
      : (sizeBytes / 1024).toFixed(2) + ' KB';
    fileList.insertAdjacentHTML('afterbegin', `
      <div class="file-item" id="${id}">
        <div class="file-info">
          <div class="file-header">
            <span class="file-name">${escapeHtml(name)}</span>
            <span class="file-size">${sizeText}</span>
          </div>
          <div class="progress-wrapper">
            <div class="progress-bar-container"><div class="progress-bar"></div></div>
            <div class="progress-text">0%</div>
          </div>
          <details class="log-details" open>
            <summary>准备上传...</summary>
            <ul class="log-list"></ul>
          </details>
        </div>
        <div class="status-badge status-uploading">上传中...</div>
      </div>`);
    const itemEl = document.getElementById(id);
    return {
      itemEl,
      statusBadge: itemEl.querySelector('.status-badge'),
      progressWrapper: itemEl.querySelector('.progress-wrapper'),
      logListEl: itemEl.querySelector('.log-list'),
      logDetails: itemEl.querySelector('.log-details'),
    };
  }

  function addLog(ctx, text, cls){
    const li = document.createElement('li');
    li.textContent = text;
    if(cls) li.className = cls;
    ctx.logListEl.appendChild(li);
    ctx.logListEl.scrollTop = ctx.logListEl.scrollHeight;
    return li;
  }
  function setBadge(ctx, text, cls){
    ctx.statusBadge.textContent = text;
    ctx.statusBadge.className = 'status-badge ' + cls;
  }

  async function putPart(uploadId, partNo, blob){
    let lastErr = null;
    for(let attempt = 0; attempt <= PART_RETRY_DELAYS.length; attempt++){
      try{
        const res = await fetch(`${API_BASE}/uploads/${uploadId}/parts/${partNo}`, {
          method: 'PUT', body: blob, headers: {'Content-Type': 'application/octet-stream'}
        });
        if(res.ok) return;
        const data = await res.json().catch(() => ({}));
        if(res.status === 404){
          const err = new Error(data.detail || '上传会话已过期');
          err.fatal = true;
          throw err;
        }
        if(res.status < 500) throw new Error(data.detail || `分片上传失败（${res.status}）`);
        throw new Error(`HTTP ${res.status}`);
      }catch(e){
        lastErr = e;
        if(e.fatal) throw e;
        if(attempt < PART_RETRY_DELAYS.length){
          await sleep(PART_RETRY_DELAYS[attempt] + Math.round(Math.random() * 500));
        }
      }
    }
    throw lastErr || new Error('分片上传失败');
  }

  async function uploadMissingAndComplete(file, session, ctx){
    const uploadId = session.upload_id;
    const chunkSize = session.chunk_size || 5 * 1024 * 1024;
    const total = session.total_parts || Math.ceil(file.size / chunkSize);
    const missing = [];
    const received = new Set(session.received_parts || []);
    for(let i = 1; i <= total; i++) if(!received.has(i)) missing.push(i);
    let done = total - missing.length;
    const paint = () => updateProgressUI(ctx.progressWrapper, (done / Math.max(total, 1)) * 10);

    await runPool(missing, PART_CONCURRENCY, async (partNo) => {
      const start = (partNo - 1) * chunkSize;
      const blob = file.slice(start, Math.min(start + chunkSize, file.size));
      await putPart(uploadId, partNo, blob);
      done += 1;
      paint();
    });
    paint();

    setBadge(ctx, '合并校验中', 'status-processing');
    for(let round = 0; round < 3; round++){
      const r = await apiJson(`/uploads/${uploadId}/complete`, {method: 'POST'});
      if(r.error === 'sha256_mismatch'){
        await fetch(`${API_BASE}/uploads/${uploadId}/abort`, {method: 'POST'}).catch(() => {});
        throw new Error('文件校验失败（sha256 不一致），请重新上传');
      }
      const stillMissing = r.missing_parts || [];
      if(stillMissing.length){
        await runPool(stillMissing, PART_CONCURRENCY, async (partNo) => {
          const start = (partNo - 1) * chunkSize;
          await putPart(uploadId, partNo, file.slice(start, Math.min(start + chunkSize, file.size)));
        });
        continue;
      }
      if(r.status === 'COMPLETED' && r.file_id){
        updateProgressUI(ctx.progressWrapper, 10);
        return r.file_id;
      }
      throw new Error('合并失败：' + (r.error || r.status || '未知错误'));
    }
    throw new Error('分片合并多次失败，请稍后重试');
  }

  async function createImportTask(fileId, meta, ctx){
    const j = await apiJson(`/files/${encodeURIComponent(fileId)}/tasks`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({kb_id: meta.kbId || '', product_name: meta.productName || ''}),
    });
    savePending({
      key: 'task:' + j.task_id, taskId: j.task_id, fileId, sha256: meta.sha256 || '',
      filename: meta.filename, size: meta.size || 0, kbId: meta.kbId || '', productName: meta.productName || '',
    });
    setBadge(ctx, '处理中', 'status-processing');
    addLog(ctx, j.deduplicated ? '复用已存在的导入任务' : '导入任务已创建', 'log-done');
    ctx.itemEl.dataset.progressFloor = '';
    pollStatus(j.task_id, ctx.itemEl, totalNodesFor(meta.filename), {taskId: j.task_id});
    return j;
  }

  async function ingestFile(file, ctx, meta){
    ctx.progressWrapper.style.display = 'block';
    try{
      const running = addLog(ctx, '计算文件校验值…', 'log-running');
      const sha = await hashFile(file, p => {
        running.textContent = `计算文件校验值… ${Math.round(p * 100)}%`;
      });
      running.remove();

      const init = await apiJson('/uploads/init', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          filename: file.name, size: file.size, sha256: sha,
          kb_id: meta.kbId || '', product_name: meta.productName || '',
        }),
      });
      meta.sha256 = sha;
      meta.filename = meta.filename || file.name;
      meta.size = file.size;

      if(init.completed){
        setBadge(ctx, '秒传完成', 'status-completed');
        updateProgressUI(ctx.progressWrapper, 10);
        addLog(ctx, '服务器已存在相同文件，秒传成功', 'log-done');
        await createImportTask(init.file_id, meta, ctx);
        return;
      }

      savePending({
        key: 'upload:' + init.upload_id, uploadId: init.upload_id, sha256: sha,
        filename: file.name, size: file.size, kbId: meta.kbId || '', productName: meta.productName || '',
      });
      if(init.received_parts && init.received_parts.length){
        addLog(ctx, `检测到上次上传进度（已传 ${init.received_parts.length}/${init.total_parts} 片），继续上传`, 'log-done');
      }else{
        addLog(ctx, '开始分片上传…', 'log-running');
      }
      setBadge(ctx, '上传中', 'status-uploading');
      const fileId = await uploadMissingAndComplete(file, init, ctx);

      clearPending(x => x.key === 'upload:' + init.upload_id);
      addLog(ctx, '文件上传完成，正在创建导入任务…', 'log-done');
      await createImportTask(fileId, meta, ctx);
    }catch(e){
      console.error(e);
      setBadge(ctx, e && e.fatal ? '会话过期' : '上传失败', 'status-error');
      const errLog = addLog(ctx, '❌ ' + (e.message || '上传失败'), null);
      errLog.style.color = '#dc2626';
      if(e && e.fatal){
        clearPending(x => x.uploadId && x.filename === file.name);
        addLog(ctx, '请重新拖入文件开始新的上传');
      }
    }
  }

  function uploadFile(file){
    const ctx = createUploadCard(file.name, file.size);
    const meta = {
      kbId: kbSelect.value === '__new__' ? '' : kbSelect.value,
      productName: kbSelect.value === '__new__' ? (newProductName.value || '').trim() : '',
      filename: file.name, size: file.size,
    };
    return ingestFile(file, ctx, meta);
  }

  function updateProgressUI(wrapper, percentage){
    const bar = wrapper.querySelector('.progress-bar');
    const text = wrapper.querySelector('.progress-text');
    const p = Math.min(Math.max(percentage, 0), 100);
    bar.style.width = p + '%';
    text.textContent = Math.round(p) + '%';
    if(p >= 100) bar.style.background = 'linear-gradient(90deg,#10b981,#34d399)';
    else if(p < 10) bar.style.background = 'linear-gradient(90deg,#f59e0b,#fbbf24)';
    else bar.style.background = 'linear-gradient(90deg,#3b82f6,#60a5fa)';
  }

  function formatDuration(seconds){
    if(seconds < 60) return seconds.toFixed(1) + 's';
    const mins = Math.floor(seconds / 60);
    const secs = (seconds % 60).toFixed(0);
    return `${mins}m${secs}s`;
  }

  function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes, durations){
    const logSummary = itemEl.querySelector('.log-details summary');
    const logListEl = itemEl.querySelector('.log-list');
    const done = Array.isArray(doneList) ? doneList : [];
    const running = Array.isArray(runningList) ? runningList : [];
    const durationMap = durations || {};
    let p = (done.length / totalNodes) * 100;
    if(running.length > 0) p += (0.5 / totalNodes) * 100;
    if(p >= 100) p = 95;
    let totalDuration = 0;
    for(const key in durationMap) totalDuration += durationMap[key];
    const totalText = totalDuration > 0 ? ` | 总耗时: ${formatDuration(totalDuration)}` : '';
    logSummary.textContent = `📋 运行日志 (已完成: ${done.length}, 进行中: ${running.length}, 共 ${totalNodes} 步${totalText})`;
    logListEl.innerHTML = '';
    for(const item of done){
      if(item === 'upload_file') continue;
      const li = document.createElement('li');
      const nameSpan = document.createElement('span');
      nameSpan.textContent = `${item} 已完成`;
      li.appendChild(nameSpan);
      if(durationMap[item] !== undefined){
        const d = document.createElement('span');
        d.className = 'log-duration';
        d.textContent = formatDuration(durationMap[item]);
        li.appendChild(d);
      }
      li.className = 'log-done';
      logListEl.appendChild(li);
    }
    for(const item of running){
      const li = document.createElement('li');
      li.textContent = `正在处理：${item}…`;
      li.className = 'log-running';
      logListEl.appendChild(li);
    }
    logListEl.scrollTop = logListEl.scrollHeight;
    return p;
  }

  function pollStatus(taskId, itemEl, totalNodes, meta){
    meta = meta || {};
    const statusBadge = itemEl.querySelector('.status-badge');
    const progressWrapper = itemEl.querySelector('.progress-wrapper');
    const logDetails = itemEl.querySelector('.log-details');
    const clearThisTask = () => clearPending(x => x.key === 'task:' + taskId);
    let stopped = false;
    let retryLi = null;
    const interval = setInterval(async () => {
      if(stopped) return;
      try{
        const res = await fetch(`${API_BASE}/status/${taskId}`);
        if(!res.ok) throw new Error('Status request failed');
        const data = await res.json();
        if(stopped) return;
        if(!data.status){
          stopped = true; clearInterval(interval);
          clearThisTask();
          statusBadge.textContent = '任务已过期';
          statusBadge.className = 'status-badge status-error';
          const li = document.createElement('li');
          li.textContent = '任务记录已不存在（可能已被清理），请重新上传文件';
          li.style.color = '#dc2626';
          itemEl.querySelector('.log-list').appendChild(li);
          return;
        }
        const p = renderLogsAndCalculateProgress(itemEl, data.done_list, data.running_list, totalNodes, data.durations);
        if(data.status === 'completed'){
          stopped = true; clearInterval(interval);
          clearThisTask();
          statusBadge.textContent = '已完成';
          statusBadge.className = 'status-badge status-completed';
          updateProgressUI(progressWrapper, 100);
          loadKbs();
          setTimeout(() => { logDetails.open = false; }, 1000);
        }else if(data.status === 'queued'){
          statusBadge.textContent = '排队中';
          statusBadge.className = 'status-badge status-queued';
          updateProgressUI(progressWrapper, p);
        }else if(data.status === 'waiting_retry'){
          statusBadge.textContent = '等待重试';
          statusBadge.className = 'status-badge status-waiting';
          const step = data.current_step || '当前步骤';
          const n = (data.attempts || {})[step];
          const clsText = data.error_class === 'RESOURCE' ? '资源紧张' : '临时故障';
          const wait = data.next_retry_in > 0 ? `${data.next_retry_in} 秒后自动重试` : '即将自动重试';
          const text = `⏳ ${step} 遇到${clsText}（${wait}${n ? `，已尝试 ${n} 次` : ''}）`;
          if(!retryLi){
            retryLi = document.createElement('li');
            retryLi.className = 'log-running';
            retryLi.style.color = '#ea580c';
            itemEl.querySelector('.log-list').appendChild(retryLi);
          }
          retryLi.textContent = text;
          updateProgressUI(progressWrapper, p);
        }else if(data.status === 'failed'){
          stopped = true; clearInterval(interval);
          if(!data.resumable) clearThisTask();
          statusBadge.textContent = '失败';
          statusBadge.className = 'status-badge status-error';
          const logListEl = itemEl.querySelector('.log-list');
          const errLog = document.createElement('li');
          errLog.textContent = data.error ? ('❌ ' + data.error) : '❌ 工作流执行失败中止';
          errLog.style.color = '#dc2626';
          logListEl.appendChild(errLog);
          if(data.resumable){
            const resumeBtn = document.createElement('button');
            resumeBtn.textContent = '继续导入';
            resumeBtn.style.cssText = 'margin:8px 0 0 0;padding:6px 16px;border:none;border-radius:8px;background:#7c3aed;color:#fff;cursor:pointer;font-size:13px;';
            resumeBtn.onclick = async () => {
              resumeBtn.disabled = true;
              resumeBtn.textContent = '正在续跑...';
              try{
                const r = await fetch(`${API_BASE}/tasks/${taskId}/resume`, {method:'POST'});
                if(!r.ok){
                  const j = await r.json().catch(() => ({}));
                  throw new Error(j.detail || '续跑请求失败');
                }
                statusBadge.textContent = '处理中';
                statusBadge.className = 'status-badge status-processing';
                errLog.textContent = '🔁 已从断点继续导入';
                errLog.style.color = '#7c3aed';
                resumeBtn.remove();
                if(retryLi){ retryLi.remove(); retryLi = null; }
                pollStatus(taskId, itemEl, totalNodes, meta);
              }catch(err){
                resumeBtn.disabled = false;
                resumeBtn.textContent = '继续导入';
                errLog.textContent = '❌ ' + (err.message || '续跑请求失败');
              }
            };
            logListEl.appendChild(resumeBtn);
          }
        }else if(data.status === 'processing'){
          if(retryLi){ retryLi.remove(); retryLi = null; }
          statusBadge.textContent = '处理中';
          statusBadge.className = 'status-badge status-processing';
          updateProgressUI(progressWrapper, p);
        }
      }catch(e){ console.error('Polling error', e); }
    }, 1500);
  }

  // ==================== 刷新后恢复未完成的上传/导入 ====================

  async function restorePending(){
    const items = loadPending();
    if(!items.length) return;
    let restored = 0;
    for(const it of items){
      try{
        if(it.taskId){
          const ctx = createUploadCard(it.filename || '导入任务', it.size || 0);
          addLog(ctx, `恢复上次导入任务（${it.taskId.slice(0, 8)}…）`, 'log-done');
          setBadge(ctx, '查询中', 'status-processing');
          pollStatus(it.taskId, ctx.itemEl, totalNodesFor(it.filename || ''), {taskId: it.taskId});
          restored++;
        }else if(it.uploadId){
          const ctx = createUploadCard(it.filename || '未完成上传', it.size || 0);
          let s = null;
          try{
            s = await apiJson(`/uploads/${it.uploadId}`);
          }catch(e){
            const res = await fetch(`${API_BASE}/uploads/${it.uploadId}`);
            if(res.status === 404){
              clearPending(x => x.uploadId === it.uploadId);
              ctx.itemEl.remove();
              continue;
            }
            throw e;
          }
          if(s.completed && s.file_id){
            addLog(ctx, '文件已在服务器完整保存，直接创建导入任务', 'log-done');
            updateProgressUI(ctx.progressWrapper, 10);
            await createImportTask(s.file_id, {
              kbId: it.kbId, productName: it.productName, sha256: it.sha256 || s.sha256,
              filename: s.filename || it.filename, size: s.size || it.size,
            }, ctx);
          }else{
            const received = (s.received_parts || []).length;
            const totalParts = s.total_parts || 0;
            addLog(ctx, `上次上传未完成（已传 ${received}/${totalParts} 片），请选择原文件继续`, 'log-running');
            setBadge(ctx, '待续传', 'status-waiting');
            const input = document.createElement('input');
            input.type = 'file';
            input.style.display = 'none';
            const btn = document.createElement('button');
            btn.textContent = '选择文件继续上传';
            btn.style.cssText = 'margin:8px 0 0 0;padding:6px 16px;border:none;border-radius:8px;background:#ea580c;color:#fff;cursor:pointer;font-size:13px;';
            btn.onclick = () => input.click();
            input.onchange = () => {
              const f = input.files && input.files[0];
              if(!f) return;
              if(f.name !== it.filename || f.size !== it.size){
                addLog(ctx, '所选文件与上次不一致（文件名和大小需相同），请选择原文件', 'log-error').style.color = '#dc2626';
                return;
              }
              btn.remove();
              input.remove();
              ingestFile(f, ctx, {kbId: it.kbId, productName: it.productName, filename: f.name, size: f.size});
            };
            ctx.logListEl.appendChild(btn);
            ctx.logListEl.appendChild(input);
          }
          restored++;
        }
      }catch(e){
        console.error('恢复待续传条目失败', it, e);
      }
    }
    if(restored) console.log(`已恢复 ${restored} 条未完成的上传/导入`);
  }

  loadKbs();
